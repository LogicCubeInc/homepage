<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 라이트 전용 선언 — 삼성인터넷 등 인앱 브라우저의 강제 다크모드 반전 방지 -->
<meta name="color-scheme" content="light">
<!-- 제목도 비움 — og:title 이 비었을 때 카카오가 <title> 을 끌어다 미리보기에 제목 줄을 붙이는 것을 방지 (이 페이지는 즉시 리디렉트되므로 빈 제목이어도 무방) -->
<title> </title>

<!-- 주의: 이 페이지는 index.html로 즉시 리디렉트되는 명함 카드용입니다.
     SEO description / naver-site-verification 은 본 홈페이지(index.html)에 있습니다.
     여기에 meta description 을 두면 카카오/페북이 og:description 대신 이를 끌어다
     미리보기에 회사 설명을 붙이므로, 명함 이미지만 노출하기 위해 의도적으로 제거함. -->

<!-- Open Graph (KakaoTalk, Facebook, LinkedIn 미리보기) -->
<!-- 제목/설명은 의도적으로 비움 — 미리보기에 명함 이미지만 깔끔하게 노출 -->
<meta property="og:type" content="website">
<!-- 제목은 채우고 설명만 빈 값으로 둠 — 카드는 유지(제목 있으므로)하면서 설명 줄을 없애기 위함.
     설명 태그를 아예 빼면 카카오가 '여기를 눌러 링크를 확인하세요' 기본 문구를 넣으므로 반드시 빈 값으로 명시. -->
<meta property="og:title" content="김진석 차장 | 로직큐브(주)">
<meta property="og:description" content="">
<meta property="og:url" content="https://www.logiccube.co.kr/shlee_index.html">
<!-- 미리보기 전용 이미지: 로고+이름+연락처를 큰 글씨로 재구성(1.91:1). 카카오 박스를 꽉 채우고 글씨가 크게 보이도록 함 -->
<meta property="og:image" content="https://www.logiccube.co.kr/public/images/og_jskim.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="628">
<meta property="og:image:alt" content="김진석 차장 | 로직큐브(주) - Tel 02-6281-8181">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.logiccube.co.kr/public/images/og_jskim.png?v=1">

<!-- 미리보기를 탭하면 곧바로 회사 홈페이지로 이동 (크롤러는 위 OG 태그만 읽고 리디렉트는 따르지 않음) -->
<meta http-equiv="refresh" content="0; url=index.html">
<link rel="canonical" href="https://www.logiccube.co.kr/index.html">
<script>location.replace('index.html');</script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#001428; }
  body {
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans KR',sans-serif; color:#ffffff;
  }
  a { color:#00BFFF; }
</style>
</head>
<body>
  <!-- 자동 이동 실패 시를 위한 수동 링크 -->
  <p>로직큐브 홈페이지로 이동 중입니다… 이동되지 않으면 <a href="index.html">여기를 클릭</a>하세요.</p>
</body>
</html>
